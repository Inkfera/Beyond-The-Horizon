<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloomtype — type that grows into a garden</title>
<meta name="description" content="Type a word and watch stems, leaves and flowers grow out of the letters. Space cuts the stems, backspace withers, enter clears. Export PNG, SVG, video and frames.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta property="og:type" content="website">
<meta property="og:title" content="Bloomtype">
<meta property="og:description" content="Type a word and watch it grow into a garden.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <input id="in" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="credit">a project by <u>Pranav</u></div>
  <div id="modes"><button data-m="type" class="on">Type</button><button data-m="poster">Poster</button></div>
  <div id="side"><div class="ttl">Poster</div><div class="mut" id="pinfo">1:1 · 3s loop · 30 fps</div>
    <div class="lab">Words</div><input id="words" value="in bloom" maxlength="40" spellcheck="false" autocomplete="off"><button class="card" id="regrow">Regrow garden</button>
    <div class="lab">Flower</div><div id="fcards"></div><button id="gl2" class="card" style="margin-top:8px">glow on</button><div class="lab">Typeface</div><div id="tcards"></div><div class="lab">Motion</div><div id="mcards"></div><div class="lab">Palette</div><div id="pcards"></div>
    <div class="lab">Export · 1080 × 1080 loop</div><button id="xv" class="card big">Export MP4 loop</button><button id="xf" class="card">PNG frames (.zip)</button><button id="xp" class="card">PNG still</button><div id="xs" class="mut" style="min-height:16px"></div></div>
  <div id="bar">
    <div id="hints"><span class="f">type to grow</span><span class="c">tap to type</span><span>space cuts</span><span class="f">backspace withers</span><span class="c">⌫ withers</span><span class="f">enter clears</span><span class="c">return clears</span><span>click for a butterfly · double-click for a rose</span></div>
    <div id="ctrls"><div id="fl"></div><div id="pal"></div><select id="fsel" aria-label="Typeface" style="pointer-events:auto;background:#000;color:#BDBDBD;border:1px solid #3A3A3A;border-radius:999px;padding:8px 10px;font:inherit;cursor:pointer;max-width:150px"></select><button id="gl" class="card" style="pointer-events:auto;border-radius:999px;padding:8px 14px;color:#BDBDBD;border-color:#3A3A3A">glow on</button><button id="xp2" class="card" style="pointer-events:auto;border-radius:999px;padding:8px 14px;color:#BDBDBD;border-color:#3A3A3A">PNG</button><button id="xsvg" class="card" style="pointer-events:auto;border-radius:999px;padding:8px 14px;color:#BDBDBD;border-color:#3A3A3A">SVG</button></div>
  </div>
</div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;color:#fff;background:#000;font-family:sans-serif">Bloomtype needs JavaScript to grow your garden.</p></noscript>
<script src="app.js"></script>
</body>
</html>
